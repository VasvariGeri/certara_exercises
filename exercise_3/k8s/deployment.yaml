apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-service
  namespace: certara-exercise-3
  labels:
    app.kubernetes.io/name: rest-service
    app.kubernetes.io/part-of: certara-exercise-3
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rest-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rest-service
        app.kubernetes.io/part-of: certara-exercise-3
    spec:
      containers:
        - name: rest-service
          image: certara-rest:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /hello-world
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /hello-world
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
